[project]
name = "ai-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "suy", email = "seouyeong8@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.150.0",
    "lightgbm>=4.7.0",
    "mlflow>=3.18.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "prefect==3.8.8",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-backend = "ai_backend:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.6",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
